    let log = function () {
      // 将 arguments 转换为数组
      const args = Array.prototype.slice.call(arguments);
      // 处理参数内容
      const content = args.map(function (arg) {
        return typeof arg === 'object' && arg !== null
          ? JSON.stringify(arg)
          : String(arg);
      }).join(' ');
      // 添加当前标头
      let fullOutput = content;
      if (log.header) {
        fullOutput = log.header + ": " + content;
      }
      // 敏感词检查
      if (fullOutput.includes("油猴转换")) return;
      // 输出日志
      if (typeof fba != 'undefined') {
        fba.log(fullOutput);
      } else {
        originalConsoleLog(fullOutput);
      }
    };
    // 添加标头设置方法
    log.setHeader = function (header) {
      if (typeof header === 'string') {
        log.header = header;
      } else {
        log.header = String(header);
      }
      return log; // 支持链式调用
    };
    // 添加清除标头方法
    log.clearHeader = function () {
      log.header = '';
      return log; // 支持链式调用
    };
    try {
      // 初始化时设置空标头
      log.header = '';
    } catch (error) {
      console.log(error)
      // 错误处理 - 创建安全的降级函数

        originalConsoleLog.apply(console, arguments);

      // 添加空方法避免报错
      safeLog.setHeader = function () { };
      safeLog.clearHeader = function () { };
      // 替换为安全的日志函数

      originalConsoleLog('日志初始化错误: ' + error.message);

    // 存储数据，并设置过期时间为1小时后
    function setItemWithExpiration(key, value, expiration) {
      const expirationMs = expiration * 1000; // 转换为毫秒
      const item = {
        value: value,
        expiration: new Date().getTime() + expirationMs // 当前时间 + 过期时间
      };
      localStorage.setItem(key, JSON.stringify(item));
    }

    // 获取数据，并检查过期时间
    function getItemWithExpiration(key) {
      const itemStr = localStorage.getItem(key);
      if (!itemStr) {
        return null;
      }
      const item = JSON.parse(itemStr);
      const currTime = new Date().getTime();
      if (currTime > item.expiration) { // 数据已过期
        localStorage.removeItem(key);
        return null;
      }
      return item.value;
    }

    // 生成GUID
    function generateGUID() {
      return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function (c) {
        var r = Math.random() * 16 | 0,
          v = c === 'x' ? r : (r & 0x3 | 0x8);
        return v.toString(16);
      });
    }

    // 随机打乱数组
    function shuffle(array) {
      for (var i = array.length - 1; i > 0; i--) {
        var j = Math.floor(Math.random() * (i + 1));
        var temp = array[i];
        array[i] = array[j];
        array[j] = temp;
      }
      return array;
    }

    // ============ FIX: 图片 URL 规范化，保留 hiker 自定义头 @headers ============
    // hiker 规则中图片可写成 url@headers={"Referer":"..."}（旧式 @Referer=/@User-Agent=/@Cookie=），
    // 由 hiker WebView 原生图片加载器解析并带自定义请求头（豆瓣图必须带 Referer 才能加载）。
    // 原实现统一 (cover||img).replace(/@.+/g,"") 会把 @headers 一并剥掉，导致豆瓣图 403。
    // 新策略：含图片头则完整保留；无图片头才剥掉 @ 后缀（兼容旧行为）。
    function hasImgHeader(url) {
      return typeof url === "string" && /@(?:headers|Referer|User-Agent|Cookie)\s*=/i.test(url);
    }
    function normalizeImgSrc(url) {
      if (typeof url !== "string") return url;
      if (url.indexOf("data:") === 0) return url;          // 脚本层已转好的 data URI 直接放行
      if (hasImgHeader(url)) return url;                   // 保留 @headers，交给 hiker 原生加载器带 Referer 请求
      return url.replace(/@.+/g, "");                      // 无图片头：沿用原剥离行为，保证兼容
    }
    // 设置图片地址；带自定义头时若加载失败，回退到裸 URL，避免个别环境不解析 @headers 时整批挂掉
    function applyImgSrc($img, rawUrl) {
      var finalSrc = normalizeImgSrc(rawUrl);
      $img.attr("src", finalSrc);
      if (hasImgHeader(rawUrl)) {
        var bareUrl = rawUrl.replace(/@(?:headers|Referer|User-Agent|Cookie)\s*=.*$/i, "");
        $img.on("error", function () {
          if (this.getAttribute("src") !== bareUrl) {
            this.setAttribute("src", bareUrl);
          }
        });
      }
      return $img;
    }

    // url修改
    function urlModify(obj, cfg) {
      let lurl = obj.surl || obj.url;
      if (obj.lurl != undefined) {

      }
      if (cfg.lurl != undefined && cfg.lurl.includes("{url}")) {
        lurl = cfg.lurl.replace("{url}", lurl);
      }
      if (cfg.lurl != undefined && cfg.lurl.includes("@replace")) {
        lurl = eval('lurl.' + cfg.lurl.replace("@", ""));
      }
      //fba.log(lurl)
      return lurl;
    }
